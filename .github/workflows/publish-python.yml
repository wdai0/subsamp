name: Publish Python Package
on:
  release:
    types: [published]
permissions:
  contents: read
jobs:
  build-and-publish:
    runs-on: ubuntu-latest
    steps:
      - name: Check out the release tag
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.release.tag_name }}
      - uses: actions/setup-python@v5
        with:
          python-version: '3.10'
      - name: Install build and reference-test dependencies
        run: |
          python -m pip install --upgrade pip setuptools wheel build twine
          python -m pip install -r tests/requirements.txt
      - name: Build source distribution and wheel
        run: python -m build --no-isolation
      - run: python tests/check_distributions.py dist
      - run: python -m twine check --strict dist/*
      - run: python -m pip install dist/*.whl
      - run: python -m pip check
      - run: python -I tests/installed_smoke.py
      - name: Test the installed release artifact
        env:
          SUBSAMP_TEST_INSTALLED: '1'
        run: |
          mkdir -p "$RUNNER_TEMP/subsamp-source"
          tar -xzf dist/*.tar.gz -C "$RUNNER_TEMP/subsamp-source"
          cd "$RUNNER_TEMP/subsamp-source"/subsampwinner-*
          python -m pytest -q
      - name: Publish the verified artifacts
        env:
          TWINE_USERNAME: ${{ secrets.PYPI_USERNAME }}
          TWINE_PASSWORD: ${{ secrets.PYPI_PASSWORD }}
        run: python -m twine upload dist/*
