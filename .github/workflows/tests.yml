name: Reference and runtime tests
on:
  pull_request:
  push:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  serial:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - python: '3.10'
            stack: reference
          - python: '3.12'
            stack: current
          - python: '3.12'
            stack: minimum-backend-pandas3
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - run: python -m pip install --upgrade pip setuptools wheel
      - if: matrix.stack == 'reference'
        run: python -m pip install -r tests/requirements.txt
      - if: matrix.stack == 'current'
        run: python -m pip install --upgrade numpy scipy statsmodels pytest
      - if: matrix.stack == 'minimum-backend-pandas3'
        run: python -m pip install numpy==1.26.4 scipy==1.13.0 statsmodels==0.14.2 'pandas>=3,<4' pytest
      - run: python -m pip wheel --no-deps --wheel-dir dist .
      - run: python -m pip install dist/*.whl
      - run: python -m pip check
      - run: python -I tests/installed_smoke.py
      - name: Contracts and all 25 frozen reference cases
        run: python -m pytest -q
